app:
  name: initra
  env: prod
  port: 8080

http:
  read_timeout: 5s
  write_timeout: 10s

logger:
  level: info
  format: json

database:
  driver: postgres
  dsn: ${INITRA_DATABASE_DSN}
  max_open_conns: 50
  max_idle_conns: 20

redis:
  addr: ${INITRA_REDIS_ADDR}
  password: ${INITRA_REDIS_PASSWORD}
  db: 0

jwt:
  issuer: initra
  secret: ${INITRA_JWT_SECRET}
  access_token_ttl: 15m
  refresh_token_ttl: 168h

casbin:
  model_path: ./configs/rbac_model.conf
  policy_path: ./configs/rbac_policy.csv

cache:
  local_ttl: 30s
  remote_ttl: 5m

idgen:
  node: 1
