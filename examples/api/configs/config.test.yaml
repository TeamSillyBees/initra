app:
  name: initra
  env: test
  port: 18080

http:
  read_timeout: 5s
  write_timeout: 10s

logger:
  level: debug
  format: json

database:
  driver: postgres
  dsn: postgres://postgres:postgres@127.0.0.1:5432/initra_test?sslmode=disable
  max_open_conns: 10
  max_idle_conns: 5

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 2

jwt:
  issuer: initra
  secret: change-me-test
  access_token_ttl: 10m
  refresh_token_ttl: 24h

casbin:
  model_path: ./configs/rbac_model.conf
  policy_path: ./configs/rbac_policy.csv

cache:
  local_ttl: 30s
  remote_ttl: 2m

idgen:
  node: 1
