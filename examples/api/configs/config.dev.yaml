app:
  name: initra
  env: dev
  version: 0.1.0
  instance_id: dev-1

server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 20s

database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "initra_dev"
  max_open_conns: 30
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  enabled: false
  addr: "127.0.0.1:6379"
  password: ""
  db: 1
  pool_size: 10

auth:
  enabled: true
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  allow_multiple_devices: true
  jwt:
    issuer: initra
    secret: "change-me-dev"

log:
  level: info
  format: json
  output: stdout
  mask:
    enabled: true
    fields: ["password", "token", "secret", "authorization"]

observability:
  metrics:
    enabled: true
  tracing:
    enabled: false
  pprof:
    enabled: false
  health:
    enabled: true

casbin:
  model_path: ./configs/rbac_model.conf
  policy_path: ./configs/rbac_policy.csv

cache:
  local_ttl: 1m
  remote_ttl: 10m

storage:
  enabled: true
  provider: local
  bucket: ""
  public_base_url: ""
  presign_default_ttl: 15m
  local:
    root_dir: ./var/uploads
    temp_dir: .multipart
    public_base_url: ""
    private_base_url: ""
    generate_date_path: true
    allowed_extensions: ["txt", "md", "png", "jpg", "jpeg", "gif", "pdf"]
    max_size: 10485760

idgen:
  node: 1
