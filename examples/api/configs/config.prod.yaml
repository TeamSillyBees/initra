app:
  name: initra
  env: prod
  version: 0.1.0
  instance_id: prod-1

server:
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 20s

database:
  host: ""
  port: 5432
  user: ""
  password: ""
  dbname: ""
  max_open_conns: 50
  max_idle_conns: 20
  conn_max_lifetime: 1h

redis:
  enabled: false
  addr: ""
  password: ""
  db: 0
  pool_size: 20

auth:
  enabled: true
  access_token_ttl: 15m
  refresh_token_ttl: 720h
  allow_multiple_devices: true
  jwt:
    issuer: initra
    secret: ""

log:
  level: info
  format: json
  output: stdout
  mask:
    enabled: true
    fields: ["password", "token", "secret", "authorization"]

observability:
  metrics:
    enabled: true
  tracing:
    enabled: false
  pprof:
    enabled: false
  health:
    enabled: true

casbin:
  model_path: ./configs/rbac_model.conf
  policy_path: ./configs/rbac_policy.csv

cache:
  local_ttl: 30s
  remote_ttl: 5m

idgen:
  node: 1
