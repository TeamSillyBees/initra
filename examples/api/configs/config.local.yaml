app:
  name: initra
  env: local
  port: 8080

http:
  read_timeout: 5s
  write_timeout: 10s

logger:
  level: debug
  format: json

jwt:
  issuer: initra
  secret: change-me-local
  access_token_ttl: 15m
  refresh_token_ttl: 168h

casbin:
  model_path: ./configs/rbac_model.conf
  policy_path: ./configs/rbac_policy.csv
