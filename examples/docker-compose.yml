name: initra

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: initra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./tmp/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./tmp/redis_data:/data
