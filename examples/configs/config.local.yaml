app:
  instance_id: local-1

database:
  host: "127.0.0.1"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "initra"
  ssl_mode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h

auth:
  jwt:
    secret: "change-me-local"

idgen:
  node: 1

log:
  level: debug
  console:
    enabled: true
    level: debug
    stack: short
  jsonl:
    enabled: true
    level: debug
    path: ./var/logs/app.jsonl
