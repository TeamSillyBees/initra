version: "2"

run:
  go: "1.26"
  tests: true
  relative-path-mode: cfg
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: strict
    paths:
      - "(^|/)examples/internal/data/ent(/|$)"
      - "(^|/)(tmp|var)(/|$)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
